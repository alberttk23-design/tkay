    <path d="M30 65 Q75 55 120 65 L115 120 Q75 110 35 120 Z" fill="#047857" opacity="0.9"/>
    <path d="M35 75 Q75 68 115 75" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
